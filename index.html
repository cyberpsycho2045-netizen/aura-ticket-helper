

<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AURA 容祖儿购票助手</title>

<style>

body{font-family:-apple-system,sans-serif;max-width:560px;margin:0 auto;padding:24px;background:#f5f5f7;color:#222}

main{background:white;padding:22px;border-radius:18px}

h1{font-size:24px}

.timer{font-size:30px;font-weight:700;margin:18px 0}

label{display:block;margin-top:16px}

input,select,button{box-sizing:border-box;width:100%;padding:13px;margin-top:7px;border:1px solid #ccc;border-radius:10px;font-size:16px}

button{background:#222;color:white;border:0;margin-top:14px}

.note{color:#666;font-size:13px;line-height:1.6}

</style>

</head>

<body>

<main>

<h1>AURA 容祖儿购票助手</h1>

<p>目标开售：2026 年 11 月 12 日 12:00（香港时间）</p>

<p>日本时间：2026 年 11 月 12 日 13:00</p>

<div id="timer" class="timer">正在计算倒计时…</div>

<label>目标票价</label>

<select id="price">

<option>HKD 1680</option>

<option>HKD 1280</option>

<option>HKD 980</option>

<option>HKD 680</option>

</select>

<label>购票人数</label>

<select id="people">

<option>1 人</option>

<option>2 人</option>

<option>3 人</option>

<option>4 人</option>

</select>

<label>官方购票页面网址</label>

<input id="url" type="url" placeholder="粘贴 Trip.com 官方活动链接">

<button onclick="savePrefs()">保存我的选择</button>

<button onclick="copyPrefs()">复制购票准备信息</button>

<button onclick="openTicket()">打开购票页面</button>

<p class="note">

本工具仅用于倒计时和购票准备。请提前登录官方平台并确认购票规则。

不保存账号密码或支付信息，不自动下单，不绕过验证码、排队或平台限制。

请勿在公共仓库填写个人敏感信息。

</p>

</main>

<script>

const target = new Date("2026-11-12T12:00:00+08:00");

const timer = document.getElementById("timer");

function tick(){

  const diff = target.getTime() - Date.now();

  if(diff <= 0){

    timer.textContent = diff > -60000

      ? "开售时间已到，请手动进入官方页面"

      : "开售时间已过，请检查官方页面";

    return;

  }

  const days = Math.floor(diff / 86400000);

  const hours = Math.floor(diff % 86400000 / 3600000);

  const mins = Math.floor(diff % 3600000 / 60000);

  const secs = Math.floor(diff % 60000 / 1000);

  timer.textContent = `${days}天 ${hours}时 ${mins}分 ${secs}秒`;

}

setInterval(tick,1000);

tick();

function savePrefs(){

  localStorage.setItem("aura-price",document.getElementById("price").value);

  localStorage.setItem("aura-people",document.getElementById("people").value);

  localStorage.setItem("aura-url",document.getElementById("url").value);

  alert("已保存在当前浏览器。");

}

function copyPrefs(){

  const text = `AURA 容祖儿购票准备\n票价：${document.getElementById("price").value}\n人数：${document.getElementById("people").value}\n请提前确认登录、支付方式及官方购票规则。`;

  if(navigator.clipboard){

    navigator.clipboard.writeText(text).then(()=>alert("准备信息已复制。"))

      .catch(()=>alert(text));

  }else{

    alert(text);

  }

}

function openTicket(){

  const url = document.getElementById("url").value.trim();

  try{

    const parsed = new URL(url);

    if(parsed.protocol !== "https:" ||

       !(parsed.hostname === "trip.com" || parsed.hostname.endsWith(".trip.com"))){

      alert("请填写确认过的 Trip.com 官方 HTTPS 链接。");

      return;

    }

    window.open(parsed.href,"_blank","noopener");

  }catch(e){

    alert("请先填写有效的 Trip.com 官方购票链接。");

  }

}

document.getElementById("price").value =

  localStorage.getItem("aura-price") || "HKD 1680";

document.getElementById("people").value =

  localStorage.getItem("aura-people") || "1 人";

document.getElementById("url").value =

  localStorage.getItem("aura-url") || "";

</script>

</body>

</html>
